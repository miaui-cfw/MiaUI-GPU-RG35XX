minarch_screen_scaling = Aspect
minarch_screen_sharpness = Soft
minarch_prevent_tearing = Lenient
-minarch_cpu_speed = Performance

-ppsspp_cpu_core = JIT
-ppsspp_fast_memory = enabled
ppsspp_io_timing_method = Fast
-ppsspp_backend = auto
-ppsspp_software_rendering = disabled
-ppsspp_internal_resolution = 480x272
