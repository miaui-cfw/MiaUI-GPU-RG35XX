minarch_screen_scaling = Aspect
minarch_screen_sharpness = Soft
minarch_prevent_tearing = Lenient
-minarch_cpu_speed = Performance

-parallel-n64-cpucore = dynamic_recompiler
-parallel-n64-gfxplugin = rice
-parallel-n64-rspplugin = hle
-parallel-n64-screensize = 640x480
-parallel-n64-gfxplugin-accuracy = medium
-parallel-n64-upscaling = 1x
-parallel-n64-virefresh = auto
-parallel-n64-dpad-stick = enabled
-parallel-n64-mouse-mode = False
-parallel-n64-alt-map = enabled
-parallel-n64-64dd-hardware = disabled
parallel-n64-disable_expmem = enabled
parallel-n64-pak1 = memory
parallel-n64-astick-sensitivity = 100

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind A Button = B:B
bind B Button = Y:Y
bind C-Right = A:R1
bind C-Up = X:X
bind C-Down = R2:A
bind C-Left = SELECT:L1
bind Z Trigger = R1:L2
bind R Shoulder = L1:R2
bind L Shoulder = L2:SELECT
bind Start = START
